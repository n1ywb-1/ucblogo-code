<!doctype html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="interactive-widget=resizes-content,   width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="logologo.ico">
  <title>UCB Logo Web Edition</title>
  <style>
    * {
      font-family: monospace;
    }

    .emscripten {
      padding-right: 0;
      margin-left: auto;
      margin-right: auto;
      display: block;
    }

    textarea.emscripten {
      font-family: monospace;
      width: 100%;
    }

    div.emscripten {
      text-align: center;
    }

    div.emscripten_border {
      border: 1px solid black;
    }

    /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
    canvas.emscripten {
      border: 0px none;
      background-color: black;
    }

    .spinner {
      height: 50px;
      width: 50px;
      margin: 0px auto;
      -webkit-animation: rotation .8s linear infinite;
      -moz-animation: rotation .8s linear infinite;
      -o-animation: rotation .8s linear infinite;
      animation: rotation 0.8s linear infinite;
      border-left: 10px solid rgb(0, 150, 240);
      border-right: 10px solid rgb(0, 150, 240);
      border-bottom: 10px solid rgb(0, 150, 240);
      border-top: 10px solid rgb(100, 0, 200);
      border-radius: 100%;
      background-color: rgb(200, 100, 250);
    }

    @-webkit-keyframes rotation {
      from {
        -webkit-transform: rotate(0deg);
      }

      to {
        -webkit-transform: rotate(360deg);
      }
    }

    @-moz-keyframes rotation {
      from {
        -moz-transform: rotate(0deg);
      }

      to {
        -moz-transform: rotate(360deg);
      }
    }

    @-o-keyframes rotation {
      from {
        -o-transform: rotate(0deg);
      }

      to {
        -o-transform: rotate(360deg);
      }
    }

    @keyframes rotation {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .flex {
      display: flex;
      justify-content: center;
    }

    .grow {
      flex-grow: 1;
    }

    .wrap {
      flex-wrap: wrap;
    }

    .reverse {
      flex-wrap: wrap-reverse;
    }

    .col {
      flex-direction: column;
    }

    body {
      margin: 0px;
      padding: 8px;
      padding-bottom: 16px;
    }

    .appContainer {
      width: 100%;
    }

    * {
      box-sizing: border-box;
    }

    svg {
      will-change: transform;
    }
  </style>
  <script>
    window.addEventListener('resize', () => {
      document.getElementById('appContainer')
        .setAttribute('style', `width: 100%; height: ${document.documentElement.clientHeight - 8 - 16}px;`)
      outputElement.scrollTop = outputElement.scrollHeight; // focus on bottom
    })
    window.addEventListener('load', () => {
      window.dispatchEvent(new Event('resize'));
      document.getElementById('logoInputText').focus();
      document.getElementById('logoInputText').select();
    })
  </script>
  <style id="logoColors">
    /* LOGO Colors */
    :root {
      --logo-color-0: black;
      --logo-color-1: rgb(0%, 0%, 99.6108949416342%);
      --logo-color-2: rgb(0%, 99.6108949416342%, 0%);
      --logo-color-3: rgb(103, 243, 243);
      --logo-color-4: rgb(99.6108949416342%, 0%, 0%);
      --logo-color-5: rgb(99.6108949416342%, 0%, 99.6108949416342%);
      --logo-color-6: rgb(99.6108949416342%, 99.6108949416342%, 0%);
      --logo-color-7: rgb(99.6108949416342%, 99.6108949416342%, 99.6108949416342%);
      --logo-color-8: rgb(60.5477988860914%, 37.5005722133211%, 23.0472266727703%);
      --logo-color-9: rgb(76.9542992294194%, 53.1258106355383%, 7.03135728999771%);
      --logo-color-10: rgb(39.0630960555428%, 63.2822156099794%, 25.0003814755474%);
      --logo-color-11: rgb(46.8757152666514%, 73.0479896238651%, 73.0479896238651%);
      --logo-color-12: rgb(99.6108949416342%, 58.2040131227588%, 46.485084306096%);
      --logo-color-13: rgb(56.2508583199817%, 44.1412985427634%, 81.2512397955291%);
      --logo-color-14: rgb(99.6108949416342%, 63.6728465705348%, 0%);
      --logo-color-15: rgb(71.4854657816434%, 71.4854657816434%, 71.4854657816434%);
    }
  </style>
</head>

<body>
  <span id="theLetterM" style="
                              position: absolute;
                              visibility: hidden;
                          ">M</span>
  <figure style="overflow:visible;" id="spinner">
    <div class="spinner"></div>
    <center style="margin-top:0.5em"><strong>emscripten</strong></center>
  </figure>
  <div class="emscripten" id="status">Downloading...</div>
  <div class="emscripten">
    <progress value="0" max="100" id="progress" hidden=1></progress>
  </div>
  <div hidden class="emscripten_border">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
  </div>
  <div hidden style="display:none" class="emscripten">
    <input type="checkbox" id="resize">Resize canvas
    <input type="checkbox" id="pointerLock" checked>Lock/hide mouse pointer
    &nbsp;&nbsp;&nbsp;
    <input type="button" value="Fullscreen"
      onclick="Module.requestFullscreen(document.getElementById('pointerLock').checked, 
                                                                                document.getElementById('resize').checked)">
  </div>

  <div id="appContainer" class="appContainer flex col">
    <div class="flex">
      <div class="flex">
        <input style="display: none" type="file" multiple id="uploadFileInput">
        <button type="button" onclick="document.getElementById('uploadFileInput').click()">
          <label>Upload Logo File</label>
        </button>
        </input>
        <script>
          document.getElementById('uploadFileInput').addEventListener('change', evt => Module.uploadFileButtonClicked(evt));
        </script>
      </div>

      <div class="flex">
        <button type="button" onclick="Module.downloadSessionClicked(event)">
          Download Logo session
        </button>
        <button type="button" onclick="Module.downloadDrawingClicked(event)">
          Download Drawing
        </button>
        <button type="button" onclick="document.getElementById('settings').open = true">
          Settings
        </button>
      </div>
    </div>

    <div class="flex" id="svgContainer" style="max-height: 80%;">
      <svg id="logoDrawing" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
        style="transform: scale(1, 1); display: none; width: 100%; position: static;" aria-labelledby="uniqueTitleID"
        role="group">
        <title id="uniqueTitleID">Turtle Graphics Drawing</title>

        <style>
          line,
          polygon {
            stroke-linecap: round;
            stroke-linejoin: round;
          }

          #logoTurtle {
            transform-box: fill-box;
            transform-origin: center;
          }

          .sizer {
            fill: none;
            stroke: none;
            height: 100%;
            width: 100%;
          }

          #logoTurtle,
          #logoTurtleTranslated {
            will-change: transform;
          }
        </style>
        <defs id="logoDefs"></defs>
        <defs id="logoSpriteDefs">
          <symbol id="logoSpriteTurtle" height="18" width="12" viewBox="0 0 12 18" style="overflow: visible">
            <g style="transform: translate(-50%, -50%)">
              <line x1="0" y1="18" x2="12" y2="18"></line>
              <line x1="0" y1="18" x2="6" y2="0"></line>
              <line x1="12" y1="18" x2="6" y2="0"></line>
            </g>
          </symbol>
          <symbol id="logoSpriteUnicodeTurtle" height="64" width="64" viewBox="0 0 32 32" style="overflow: visible;">
            <g transform="rotate(90)">
              <text font-size="32px" x="-24" y="8">🐢</text>
            </g>
          </symbol>
        </defs>
        <g id="logoDrawingContainer">
          <rect id="logoBackground" style="height: 100%; width: 100%"></rect>
          <g id="logoDrawingElements">
            <rect class="sizer" style="height: 100%; width: 100%"></rect>
          </g>
        </g>
        <g id="logoTurtleTranslated" transform="translate(314, 231)" style="stroke: black">
          <g id="logoTurtle">
            <use id="logoTurtleUse" href="#logoSpriteTurtle" />
          </g>
        </g>
      </svg>
    </div>

    <div class="flex grow" id="logoInputContainer" style="width: 100%">
      <div class="flex col grow">
        <div class="flex grow">
          <textarea rows="4" readonly class="emscripten" id="output"></textarea>
        </div>

        <div class="flex">
          <form id="logoInputForm" class="flex" style="width: 100%">
            <input name="logoInputText" id="logoInputText" type="text" style="width: 100%"
              placeholder="Enter Logo commands here" onkeydown="Module.handleKeyDown(event)" spellcheck="off"
              autocomplete="off"></input>
            <input type="submit" label="Run"></input>
          </form>
        </div>
      </div>
    </div>

    <!-- <div>
      Logo Files
      <file-list data-files="">
        <li>No Files Uploaded Yet</li>
        <template id="fileListItemTemplate">
          <li><span data-file=""></span><button class="loadFileButton" data=></button></li>
        </template>
      </file-list>
    </div> -->
    <dialog id="splash">
      Splash Dialog
    </dialog>
    <dialog id="files">
      File browser dialog
    </dialog>
    <dialog id="settings">
      <div style="border-bottom: 1px solid black">Settings</div>
      <ul>
        <!-- <li>
          <input type="checkbox">
          <label>Expandable drawing</label>
          </input>
        </li>
        <li>
          <input type="checkbox">
          <label>Drawing size</label>
          </input>
        </li> -->
        <li>
          <label>Shape rendering mode</label>
          <ul>
            <li>
              <input type=radio name="shapeRenderingMode" checked value="geometricprecision"
                onclick="document.getElementById('logoDrawing').style.setProperty('shape-rendering', 'geometricprecision')"><label>Geometric-precision
                (anti-aliasing)</label>
              </input>
            </li>
            <li>
              <input type=radio name="shapeRenderingMode" value="crispedges"
                onclick="document.getElementById('logoDrawing').style.setProperty('shape-rendering', 'crispedges')"><label>Crisp-edges
                (no anti-aliasing)</label></input>
            </li>
            <li>
              <input type=radio name="shapeRenderingMode" value="optimizespeed"
                onclick="document.getElementById('logoDrawing').style.setProperty('shape-rendering', 'optimizespeed')"><label>Optimize-speed
                (no anti-aliasing)</label></input>
            </li>
          </ul>
          </input>
        </li>
      </ul>
      <button type="button" onclick="document.getElementById('settings').open = false">Ok</button>
    </dialog>
  </div>

  <script type='text/javascript'>
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var spinnerElement = document.getElementById('spinner');
    var canvasElement = document.getElementById('canvas');
    var outputElement = document.getElementById('output');
    if (outputElement) outputElement.value = ''; // clear browser cache

    // As a default initial behavior, pop up an alert when webgl context is lost. To make your
    // application robust, you may want to override this behavior before shipping!
    // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
    canvasElement.addEventListener("webglcontextlost", (e) => {
      alert('WebGL context lost. You will need to reload the page.');
      e.preventDefault();
    }, false);

    var Module = {
      print(...args) {
        // These replacements are necessary if you render to raw HTML
        //text = text.replace(/&/g, "&amp;");
        //text = text.replace(/</g, "&lt;");
        //text = text.replace(/>/g, "&gt;");
        //text = text.replace('\n', '<br>', 'g');
        console.log(...args);
        if (outputElement) {
          var text = args.join(' ');
          outputElement.value += text;
          outputElement.value += "\n";
          outputElement.scrollTop = outputElement.scrollHeight; // focus on bottom
        }
      },
      canvas: canvasElement,
      setStatus(text) {
        Module.setStatus.last ??= { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (m) {
          text = m[1];
          progressElement.value = parseInt(m[2]) * 100;
          progressElement.max = parseInt(m[4]) * 100;
          progressElement.hidden = false;
          spinnerElement.hidden = false;
        } else {
          progressElement.value = null;
          progressElement.max = null;
          progressElement.hidden = true;
          if (!text) spinnerElement.hidden = true;
        }
        statusElement.innerHTML = text;
      },
      totalDependencies: 0,
      monitorRunDependencies(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };
    Module.setStatus('Downloading...');
    window.onerror = () => {
      Module.setStatus('Exception thrown, see JavaScript console');
      spinnerElement.style.display = 'none';
      Module.setStatus = (text) => {
        if (text) console.error('[post-exception status] ' + text);
      };
    };

    /* getc stdin emulation */
    document.addEventListener("DOMContentLoaded", (event) => {
      console.log("DOM fully loaded and parsed");
      const inputForm = document.getElementById('logoInputForm');
      inputForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        let line = new FormData(event.target)
          .get('logoInputText')
        Module.commandHistory.unshift(line);
        Module.commandHistoryIdx = -1;
        Module.print(line);
        let chars = line.split("");
        chars.push("\n");
        Module.FS_runjs_getChar_buffer.push(...chars);
        document.getElementById('logoInputText').value = "";
        document.dispatchEvent(new CustomEvent("getcharready"));
        return false;
      });
      screen.orientation.addEventListener("change", (event)=>{
        if (event.target.type.startsWith('landscape')) {
          const logoDrawing = document.getElementById('logoDrawing');
          logoDrawing.requestFullscreen();
        }
        else {
          document.exitFullscreen();
        }
      });
    });

  </script>

</body>

</html>
